name = "lynq-x-assistant"
main = "worker.js"
compatibility_date = "2026-01-01"

# Das Sprachmodell laeuft bei Cloudflare selbst — kein API-Schluessel noetig.
[ai]
binding = "AI"

[vars]
ALLOWED_ORIGINS = "https://lynq-x.de,https://www.lynq-x.de"

# Speicher fuer Anfragen, Angebote und Sitzungen des internen Bereichs.
# Ohne diesen Speicher laeuft der Chat weiter, aber admin.html bleibt leer.
# Erst anlegen:
#   npx wrangler kv namespace create ANFRAGEN
# Dann die ausgegebene id hier eintragen.
#
# [[kv_namespaces]]
# binding = "ANFRAGEN"
# id = "HIER_DIE_ID_EINTRAGEN"

# Optionale Begrenzung pro Besucher im Chat. Erst anlegen:
#   npx wrangler kv namespace create RATE_LIMIT
# Dann die ausgegebene id eintragen und die drei Zeilen einkommentieren.
#
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "HIER_DIE_ID_EINTRAGEN"

# Das Passwort fuer den internen Bereich gehoert nicht in diese Datei, sonst
# steht es oeffentlich auf GitHub. Als Secret setzen:
#   npx wrangler secret put ADMIN_PASSWORT
# Ohne dieses Secret gilt der im Code hinterlegte Standard.

# Benachrichtigung bei neuen Anfragen. Beides als Secret setzen:
#   npx wrangler secret put TELEGRAM_TOKEN
#   npx wrangler secret put TELEGRAM_CHAT_ID
# Ohne diese beiden laeuft alles weiter, es kommt nur keine Push.

# Mailversand direkt aus dem Angebotstool. Optional:
#   npx wrangler secret put RESEND_KEY
# und dazu MAIL_VON als Variable, z. B. "Lynq-x <angebot@lynq-x.de>".
# Fehlt eins von beiden, bleibt es beim Weg ueber das Mailprogramm.
